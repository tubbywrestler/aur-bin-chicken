name: Sync and build AUR bin package

on:
  workflow_call:
    inputs:
      aur_pkgbase:
        description: "Name of the AUR base package to track and build"
        required: true
        type: string
      source_url:
        description: >
          Override git URL to clone the base package from, instead of
          https://aur.archlinux.org/<aur_pkgbase>.git. For cases where a real
          AUR package needs a fix its maintainer hasn't taken yet and you're
          not a co-maintainer able to push there yourself - point this at your
          own mirror with the fix applied instead. Not a substitute for
          getting the fix upstreamed; aur_pkgbase is still used for release
          tags and is expected to match the mirror's own pkgname.
        required: false
        type: string
        default: ""
      run_tests:
        description: "Run the base package's own check() step (makepkg without --nocheck)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      pkgver: ${{ steps.version.outputs.pkgver }}
      pkgrel: ${{ steps.version.outputs.pkgrel }}
      tag: ${{ steps.version.outputs.tag }}
      is_new: ${{ steps.exists.outputs.is_new }}
    steps:
      - name: Clone AUR base package
        run: |
          url="${{ inputs.source_url }}"
          [ -n "$url" ] || url="https://aur.archlinux.org/${{ inputs.aur_pkgbase }}.git"
          git clone --depth 1 "$url" aur-src

      - name: Read pkgver/pkgrel
        id: version
        run: |
          # Source rather than grep - some PKGBUILDs compute pkgver via shell
          # expansion (e.g. cloudcompare's pkgver="${_fragment###tag=v}") rather
          # than a plain literal, which a regex can't evaluate.
          cd aur-src
          source PKGBUILD
          echo "pkgver=$pkgver" >> "$GITHUB_OUTPUT"
          echo "pkgrel=$pkgrel" >> "$GITHUB_OUTPUT"
          echo "tag=${pkgver}-${pkgrel}" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - name: Bootstrap git and GitHub CLI
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git github-cli sudo

      - name: Create unprivileged build user
        run: |
          # Needed before dependency resolution now, not just before the build -
          # both the AUR helper bootstrap and makepkg itself refuse to run as root.
          # NOPASSWD sudo is fine here only because this container is destroyed
          # at the end of the run.
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Bootstrap AUR helper (yay)
        run: |
          su builder -c '
            cd ~
            git clone -q https://aur.archlinux.org/yay-bin.git
            cd yay-bin
            makepkg -si --noconfirm
          '

      - name: Clone AUR base package
        run: |
          url="${{ inputs.source_url }}"
          [ -n "$url" ] || url="https://aur.archlinux.org/${{ inputs.aur_pkgbase }}.git"
          su builder -c "git clone --depth 1 \"$url\" aur-src"

      - name: Install base package dependencies
        run: |
          # Use yay, not plain pacman - some base packages depend on AUR-only
          # packages themselves (e.g. cloudcompare needs qt5-websockets, mpir,
          # fbx-sdk; cangaroo needs qt5-charts), which pacman alone can't resolve.
          # yay builds those from AUR the same way a human running it manually
          # would; this is a deliberate expansion of trust (CI now auto-builds
          # whatever AUR packages a base package's deps reference, recursively,
          # unattended) and can make build times less predictable for deep AUR
          # dependency chains - acceptable for the small/self-contained packages
          # seen so far.
          su builder -c '
            cd aur-src
            source PKGBUILD
            yay -S --noconfirm --needed "${makedepends[@]}" "${depends[@]}"
          '

      - name: Build package
        env:
          RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          if [ "$RUN_TESTS" = "true" ]; then
            su builder -c 'cd aur-src && makepkg'
          else
            su builder -c 'cd aur-src && makepkg --nocheck'
          fi

      - name: Read actual built version
        id: built
        run: |
          # For VCS packages with a dynamic pkgver() (git describe, etc.), makepkg
          # rewrites PKGBUILD's pkgver in place if it computed something different
          # from what was checked in - so re-read it post-build rather than
          # trusting the check job's pre-build value, to keep the release tag,
          # artifact filename, and -bin PKGBUILD's source= URL self-consistent.
          # For ordinary static-pkgver packages this just reproduces the same
          # value the check job already found.
          cd aur-src
          source PKGBUILD
          echo "pkgver=$pkgver" >> "$GITHUB_OUTPUT"
          echo "pkgrel=$pkgrel" >> "$GITHUB_OUTPUT"
          echo "tag=${pkgver}-${pkgrel}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Exclude any *-debug-*.pkg.tar.zst - if the base PKGBUILD doesn't set
          # options=(!debug), makepkg also produces a debug package alongside the
          # real one, which nothing in the -bin PKGBUILD ever references.
          mapfile -t assets < <(ls aur-src/*.pkg.tar.zst | grep -v -- '-debug-')
          tag="${{ steps.built.outputs.tag }}"
          # A multi-arch -bin package (e.g. can-utils-bin) may have another,
          # independently-triggered workflow publishing a different arch's asset
          # under this same tag - if it got there first, upload into that release
          # instead of failing on "already exists".
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "${{ github.repository }}" \
              --title "$tag" \
              --notes "Automated build of ${{ inputs.aur_pkgbase }} ${tag}"
          fi

      - name: Checkout bin package repo
        uses: actions/checkout@v7
        with:
          path: bin-repo

      - name: Bump bin package PKGBUILD
        env:
          NEW_PKGVER: ${{ steps.built.outputs.pkgver }}
          NEW_PKGREL_SRC: ${{ steps.built.outputs.pkgrel }}
        run: |
          artifact=$(ls aur-src/*.pkg.tar.zst | grep -v -- '-debug-' | head -n1)
          sha=$(sha256sum "$artifact" | awk '{print $1}')
          cd bin-repo
          sed -i "s/^pkgver=.*/pkgver=${NEW_PKGVER}/" PKGBUILD
          sed -i "s/^_pkgrel_src=.*/_pkgrel_src=${NEW_PKGREL_SRC}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          # Match sha256sums= or an arch-suffixed sha256sums_x86_64= etc,
          # preserving whichever exact field name is present - needed for
          # multi-arch PKGBUILDs (e.g. can-utils-bin's armv7h variant) without
          # changing behavior for every other consumer's plain sha256sums=.
          sed -i -E "s/^(sha256sums[A-Za-z0-9_]*)=.*/\1=('${sha}')/" PKGBUILD
          # makepkg needs write access to the directory itself (even in
          # --printsrcinfo mode) plus the two files it touches. Use chmod,
          # not chown - changing ownership of the worktree top-level
          # directory (even non-recursively) makes git treat it as
          # "dubious ownership" for the next (root) step's git commands.
          touch .SRCINFO
          chmod o+w . PKGBUILD .SRCINFO
          su builder -c "makepkg --printsrcinfo > .SRCINFO"

      - name: Commit and push bin package bump
        run: |
          cd bin-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if ! git diff --cached --quiet; then
            git commit -m "${{ steps.built.outputs.tag }}"
            git push
          fi

      - name: Update aur branch (flat files only, for AUR push)
        run: |
          cd bin-repo
          # AUR's git hooks reject any push containing a subdirectory, and this
          # repo's master has .github/workflows/, so a separate branch with just
          # the files AUR needs is required. IMPORTANT: AUR's server also rejects
          # non-fast-forward pushes to master (it will not accept rewritten
          # history), so this branch must be built incrementally on top of
          # whatever it already contains - never regenerated as a fresh orphan
          # after the first run, or every subsequent push to AUR breaks with
          # "denying non-fast-forward" / "hook declined to update refs/heads/master".
          if git ls-remote --exit-code --heads origin aur >/dev/null 2>&1; then
            git fetch origin aur
            git checkout -B aur origin/aur
          else
            git checkout --orphan aur
            git rm -rf --cached . >/dev/null 2>&1 || true
            git clean -fdx >/dev/null
          fi
          for f in PKGBUILD .SRCINFO .gitignore; do
            git checkout master -- "$f" 2>/dev/null || true
          done
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "${{ steps.built.outputs.tag }}"
            git push origin aur
          fi
          git checkout master
